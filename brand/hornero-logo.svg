  <defs>
    <linearGradient id="clay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEB49E"/>
      <stop offset="100%" stop-color="#CF785A"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO EN EL LADO IZQUIERDO -->
  <g transform="translate(45, 245) scale(0.60)">
    <!-- Base rama -->
    <path d="M 25 415 C 130 410, 265 410, 370 415" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round"/>

    <!-- Nido de barro -->
    <g transform="translate(30, 200)">
      <path d="M 20 215 C 5 110, 80 30, 175 30 C 270 30, 310 110, 305 215 Z" fill="url(#clay)"/>
      <path d="M 10 215 L 315 215" stroke="#B4593C" stroke-width="12" stroke-linecap="round"/>
      <path d="M 50 120 C 110 95, 200 95, 260 130" fill="none" stroke="#D96E4C" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
