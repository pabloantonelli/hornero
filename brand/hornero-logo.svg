      <path d="M 130 145 C 130 120, 115 110, 100 110" fill="none" stroke="#EEB49E" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Hornero gordito -->
    <g transform="translate(110, 10)">
      <!-- Patitas -->
      <path d="M 90 205 L 82 230 M 120 205 L 128 230" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
      <!-- Cola -->
      <path d="M 20 165 L -35 140 L 5 190 Z" fill="#B45334"/>
      <!-- Cuerpo gordito -->
      <ellipse cx="88" cy="150" rx="76" ry="64" fill="#C86747"/>
      <!-- Pecho claro crema -->
      <path d="M 118 100 C 162 130, 168 185, 132 210 C 102 215, 82 200, 82 200 C 122 180, 132 135, 118 100 Z" fill="#FFF1E6"/>
      <!-- Ala -->
      <ellipse cx="52" cy="150" rx="42" ry="28" transform="rotate(-15 52 150)" fill="#A84C2F"/>
      <!-- Cabeza redonda -->
      <circle cx="132" cy="90" r="44" fill="#CF7050"/>
      <!-- Cejita clara -->
      <path d="M 122 68 C 136 66, 158 71, 166 80" stroke="#FFF1E6" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Ojo -->
      <circle cx="144" cy="84" r="9.5" fill="#0F172A"/>
      <circle cx="147" cy="81" r="3.5" fill="#FFFFFF"/>
      <!-- Pico fino -->
      <path d="M 170 84 L 228 92 L 170 102 Z" fill="#475569"/>
    </g>
  </g>

